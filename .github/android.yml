name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone upstream Mister Download Manager
        run: |
          git clone --depth 1 https://github.com/anefzaoui/misterdownloadmanager.git upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK & CMake
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install system dependencies for bindgen/BoringSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake nasm

      - name: Install Rust & Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Apply Android portability patches
        run: python3 scripts/apply_upstream_patches.py

      - name: Build Rust .so & generate Kotlin UniFFI bindings
        run: |
          chmod +x scripts/build_android.sh
          ./scripts/build_android.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdm-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
