[package]
name = "mdm-android"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "mdm_android"

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi_bindgen.rs"

[dependencies]
# 引入上游核心引擎与 BT 模块（需先将上游仓库放到 ../../upstream）
mdm-engine = { path = "../../upstream/crates/engine" }
mdm-torrent = { path = "../../upstream/crates/torrent" }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "time"] }
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
android_logger = "0.14"
url = "2"
http = "1"

# HLS (m3u8) 下载用：reqwest 走上游打过补丁的 TLS 配置（mdm_engine::tls::configure），
# 版本须与上游一致（0.13.5），否则类型对不上。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
m3u8-rs = "6"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
futures = "0.3"

# Patch librqbit to use the fork with custom APIs (PieceOrder, MetadataProgress, PeerFilter, etc.)
# required by mdm-torrent. Copied from upstream Cargo.toml [patch.crates-io].
[patch.crates-io]
librqbit = { git = "https://github.com/anefzaoui/rqbit.git", rev = "ee59e8ae532d12580dba8b84670c8a23fa818c23" }
librqbit-bencode = { git = "https://github.com/anefzaoui/rqbit.git", rev = "ee59e8ae532d12580dba8b84670c8a23fa818c23" }
librqbit-buffers = { git = "https://github.com/anefzaoui/rqbit.git", rev = "ee59e8ae532d12580dba8b84670c8a23fa818c23" }
librqbit-clone-to-owned = { git = "https://github.com/anefzaoui/rqbit.git", rev = "ee59e8ae532d12580dba8b84670c8a23fa818c23" }
librqbit-core = { git = "https://github.com/anefzaoui/rqbit.git", rev = "ee59e8ae532d12580dba8b84670c8a23fa818c23" }
librqbit-dht = { git = "https://github.com/anefzaoui/rqbit.git", rev = "ee59e8ae532d12580dba8b84670c8a23fa818c23" }
librqbit-lsd = { git = "https://github.com/anefzaoui/rqbit.git", rev = "ee59e8ae532d12580dba8b84670c8a23fa818c23" }
librqbit-peer-protocol = { git = "https://github.com/anefzaoui/rqbit.git", rev = "ee59e8ae532d12580dba8b84670c8a23fa818c23" }
librqbit-sha1-wrapper = { git = "https://github.com/anefzaoui/rqbit.git", rev = "ee59e8ae532d12580dba8b84670c8a23fa818c23" }
librqbit-tracker-comms = { git = "https://github.com/anefzaoui/rqbit.git", rev = "ee59e8ae532d12580dba8b84670c8a23fa818c23" }
librqbit-upnp = { git = "https://github.com/anefzaoui/rqbit.git", rev = "ee59e8ae532d12580dba8b84670c8a23fa818c23" }
librqbit-utp = { git = "https://github.com/ikatson/librqbit-utp.git", rev = "06e1c53c8df6edb2830d6aab64a6d4bed8479908" }
